<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear</title>
    <style>
        div {
            width: 250px;
            height: 100px;
            margin: 10px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 6px;
        }
        .a { background: linear-gradient(to top, yellow, coral); }
        .b { background: linear-gradient(to right, blue, green); }
        .c { background: linear-gradient(145deg, magenta, pink, orange); }
    </style>
</head>
<body>
    <div class="a">Top → Bottom</div>
    <div class="b">Left → Right</div>
    <div class="c">Diagonal 45°</div>
</body>
</html>
