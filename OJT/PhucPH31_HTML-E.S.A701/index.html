<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA Survey Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5 url('background/background.jpg') center/cover fixed;
            color: #333;
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .description {
            color: #7f8c8d;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 0 0 5px 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 16px;
        }

        .checkbox-group, .radio-group {
            margin-top: 10px;
        }

        .checkbox-item, .radio-item {
            margin: 8px 0;
        }

        textarea {
            min-height: 100px;
        }

        .submit-button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
        }

        .submit-button:hover {
            background: #2980b9;
        }

        .warning {
            color: #e74c3c;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form>
            <header class="header">
                <h1>FA Survey Form</h1>
                <p class="description">Thank you for taking the time to help us improve the platform</p>
            </header>
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="age">Age <span>(optional)</span></label>
                <input type="number" name="age" id="age" class="form-control" placeholder="Enter your age">
            </div>
            
            <div class="form-group">
                <label for="role">Which option best describes your current role?</label>
                <select id="role" name="role" class="form-control" required>
                    <option disabled selected value>Select current role</option>
                    <option value="student">Student</option>
                    <option value="full-time-job">Full Time Job</option>
                    <option value="full-time-learner">Full Time Learner</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Would you recommend FA to a friend?</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="definitely" name="recommend" value="definitely" required>
                        <label for="definitely">Definitely</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="maybe" name="recommend" value="maybe">
                        <label for="maybe">Maybe</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="not-sure" name="recommend" value="not-sure">
                        <label for="not-sure">Not sure</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>What would you like to see improved? <span class="warning">(Check all then apply)</span></label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="frontend" name="improvements" value="frontend">
                        <label for="frontend">Front-end Projects</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="backend" name="improvements" value="backend">
                        <label for="backend">Back-end Projects</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="ml" name="improvements" value="ml">
                        <label for="ml">Machine Learning</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="presentation" name="improvements" value="presentation">
                        <label for="presentation">Presentation Skills</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="comments">Any comments or suggestions?</label>
                <textarea id="comments" name="comments" class="form-control" placeholder="Enter your comment here..."></textarea>
            </div>
            
            <button type="submit" class="submit-button">Submit</button>
        </form>
    </div>
</body>
</html>
